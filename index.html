<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ambient Video & Custom Alert Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .controls-panel {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .control-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    select, input[type="file"], button {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      background: #007bff;
      border: none;
    }
    button:hover {
      background: #0056b3;
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
    }
    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Ambient Hub & Custom Alert System</h2>

  <div class="controls-panel">
    <!-- Category Selection (15 videos per section) -->
    <div class="control-group">
      <label for="categorySelect">Choose Theme (15 Videos, 5-min auto switch):</label>
      <select id="categorySelect" onchange="changeCategory()">
        <option value="space">Space</option>
        <option value="cinematic">Cinematic</option>
        <option value="love">Love</option>
        <option value="rain">Rain</option>
      </select>
    </div>

    <!-- 10 Background Music Track Options -->
    <div class="control-group">
      <label for="musicSelect">Background Music (10 Options):</label>
      <select id="musicSelect" onchange="changeMusic()">
        <option value="">-- Mute Music --</option>
        <option value="music1.mp3">1. Soft Piano</option>
        <option value="music2.mp3">2. Gentle Rain Ambience</option>
        <option value="music3.mp3">3. Cinematic Strings</option>
        <option value="music4.mp3">4. Space Soundscape</option>
        <option value="music5.mp3">5. Romantic Guitar</option>
        <option value="music6.mp3">6. Deep Chill Lofi</option>
        <option value="music7.mp3">7. Acoustic Medley</option>
        <option value="music8.mp3">8. Celestial Waves</option>
        <option value="music9.mp3">9. Emotional Violin</option>
        <option value="music10.mp3">10. Peaceful Meditation</option>
      </select>
    </div>

    <!-- 5 Downloaded Alert Tones + Custom Audio Upload -->
    <div class="control-group">
      <label for="toneSelect">Select Alert Tone:</label>
      <select id="toneSelect" onchange="updateAlertTone()">
        <option value="alert1.mp3">Alert Tone 1</option>
        <option value="alert2.mp3">Alert Tone 2</option>
        <option value="alert3.mp3">Alert Tone 3</option>
        <option value="alert4.mp3">Alert Tone 4</option>
        <option value="alert5.mp3">Alert Tone 5</option>
        <option value="custom">Upload New Tone...</option>
      </select>

      <!-- Hidden File Input for Custom Tone Upload -->
      <input type="file" id="customToneInput" accept="audio/*" style="display: none;" onchange="handleCustomTone(event)">
      <button onclick="playAlertTone()">Test Alert Tone</button>
    </div>
  </div>

  <!-- Main Video Player -->
  <div class="video-container">
    <video id="mainPlayer" autoplay muted loop playsinline></video>
  </div>
</div>

<!-- Audio Player for Background Music -->
<audio id="bgMusicPlayer" loop></audio>

<script>
  // Database of 15 videos per category
  const videoData = {
    space: [
      "space1.mp4", "space2.mp4", "space3.mp4", "space4.mp4", "space5.mp4",
      "space6.mp4", "space7.mp4", "space8.mp4", "space9.mp4", "space10.mp4",
      "space11.mp4", "space12.mp4", "space13.mp4", "space14.mp4", "space15.mp4"
    ],
    cinematic: [
      "cinematic1.mp4", "cinematic2.mp4", "cinematic3.mp4", "cinematic4.mp4", "cinematic5.mp4",
      "cinematic6.mp4", "cinematic7.mp4", "cinematic8.mp4", "cinematic9.mp4", "cinematic10.mp4",
      "cinematic11.mp4", "cinematic12.mp4", "cinematic13.mp4", "cinematic14.mp4", "cinematic15.mp4"
    ],
    love: [
      "love1.mp4", "love2.mp4", "love3.mp4", "love4.mp4", "love5.mp4",
      "love6.mp4", "love7.mp4", "love8.mp4", "love9.mp4", "love10.mp4",
      "love11.mp4", "love12.mp4", "love13.mp4", "love14.mp4", "love15.mp4"
    ],
    rain: [
      "rain1.mp4", "rain2.mp4", "rain3.mp4", "rain4.mp4", "rain5.mp4",
      "rain6.mp4", "rain7.mp4", "rain8.mp4", "rain9.mp4", "rain10.mp4",
      "rain11.mp4", "rain12.mp4", "rain13.mp4", "rain14.mp4", "rain15.mp4"
    ]
  };

  let currentCategory = "space";
  let currentVideoIndex = 0;
  let rotationTimer = null;

  const player = document.getElementById("mainPlayer");
  const bgMusicPlayer = document.getElementById("bgMusicPlayer");
  
  // Set default initial tone to your first downloaded file
  let alertAudio = new Audio("alert1.mp3");

  // Load initial video
  function loadVideo() {
    const videoList = videoData[currentCategory];
    player.src = videoList[currentVideoIndex];
    player.play().catch(e => console.log("Autoplay check:", e));
  }

  // 5-minute auto rotation logic (300,000 ms)
  function startVideoRotation() {
    if (rotationTimer) clearInterval(rotationTimer);
    
    rotationTimer = setInterval(() => {
      currentVideoIndex = (currentVideoIndex + 1) % videoData[currentCategory].length;
      loadVideo();
    }, 5 * 60 * 1000); 
  }

  function changeCategory() {
    currentCategory = document.getElementById("categorySelect").value;
    currentVideoIndex = 0;
    loadVideo();
    startVideoRotation();
  }

  // Music Player logic
  function changeMusic() {
    const musicSrc = document.getElementById("musicSelect").value;
    if (musicSrc) {
      bgMusicPlayer.src = musicSrc;
      bgMusicPlayer.play().catch(e => console.log("Music play blocked:", e));
    } else {
      bgMusicPlayer.pause();
    }
  }

  // Alert Tone Logic
  function updateAlertTone() {
    const select = document.getElementById("toneSelect");
    if (select.value === "custom") {
      document.getElementById("customToneInput").click();
    } else {
      alertAudio.src = select.value;
    }
  }

  function handleCustomTone(event) {
    const file = event.target.files[0];
    if (file) {
      const customUrl = URL.createObjectURL(file);
      alertAudio.src = customUrl;
    }
  }

  function playAlertTone() {
    alertAudio.currentTime = 0;
    alertAudio.play().catch(err => console.log("Audio play blocked:", err));
  }

  // Initialize
  loadVideo();
  startVideoRotation();
</script>

</body>
</html>
