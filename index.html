<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat</title>
  <style>
    /* ENDLESS BACKGROUND VIDEO STYLES */
    #bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      object-fit: cover;
      transition: opacity 1s ease-in-out;
    }

    body { 
      font-family: Arial, sans-serif; 
      max-width: 500px; 
      margin: 30px auto; 
      padding: 20px; 
      min-height: 90vh;
    }
    h2 { text-align: center; color: #333; }
    #login-screen { background: rgba(255, 255, 255, 0.9); padding: 20px; border-radius: 8px; border: 1px solid #ccc; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); backdrop-filter: blur(5px); }
    #chat-screen { display: none; background: rgba(255, 255, 255, 0.9); padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); backdrop-filter: blur(5px); }
    #chat-box { height: 350px; border: 1px solid #ccc; background: rgba(249, 249, 249, 0.95); overflow-y: scroll; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; width: fit-content; max-width: 80%; }
    .my-msg { background: #007bff; color: white; margin-left: auto; }
    .friend-msg { background: #e9e9eb; color: #333; }
    .input-group { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 16px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <!-- BACKGROUND VIDEO ELEMENT -->
  <video autoplay muted loop playsinline id="bg-video">
    <source id="video-source" src="1.mp4" type="video/mp4">
  </video>

  <!-- STEP 1: PASSWORD LOCK SCREEN -->
  <div id="login-screen">
    <h2>🔒 Protected Chat</h2>
    <p>Enter the secret password to join:</p>
    <div style="display: flex; gap: 8px; justify-content: center;">
      <input type="password" id="pass-input" placeholder="Password...">
      <button onclick="checkPassword()">Enter</button>
    </div>
  </div>

  <!-- STEP 2: CHAT SCREEN -->
  <div id="chat-screen">
    <h2>Secret Chat Room</h2>
    <div id="chat-box"></div>

    <div class="input-group">
      <input type="text" id="username" placeholder="Secret Alias..." style="width: 35%;" value="">
      <input type="text" id="message" placeholder="Type a message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- 30-MINUTE AUTOMATIC VIDEO SWITCHER -->
  <script>
    // List of your actual uploaded video files
    const videoList = [
      "1.mp4", "3.mp4", "4.mp4", "5.mp4", "9.mp4", "10.mp4",
      "12.mp4", "14.mp4", "15.mp4", "16.mp4", "20.mp4",
      "21.mp4", "22.mp4", "23.mp4", "24.mp4", "25.mp4",
      "27.mp4", "29.mp4", "30.mp4", "31.mp4"
    ];

    let currentVideoIndex = 0;
    const thirtyMinutesInMs = 30 * 60 * 1000; // 30 minutes in milliseconds

    function changeBackgroundVideo() {
      currentVideoIndex = (currentVideoIndex + 1) % videoList.length;
      
      const videoPlayer = document.getElementById("bg-video");
      const videoSource = document.getElementById("video-source");

      // Smooth fade out/in effect
      videoPlayer.style.opacity = "0";

      setTimeout(() => {
        videoSource.src = videoList[currentVideoIndex];
        videoPlayer.load();
        videoPlayer.play();
        videoPlayer.style.opacity = "1";
      }, 1000);
    }

    // Automatically trigger video switch every 30 minutes
    setInterval(changeBackgroundVideo, thirtyMinutesInMs);
  </script>

  <!-- FIREBASE CHAT LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAVmzfXqyT_oZaqOyYlM7rvi-PyOyiP_bA",
      authDomain: "privatechat-8f1a8.firebaseapp.com",
      databaseURL: "https://privatechat-8f1a8-default-rtdb.firebaseio.com",
      projectId: "privatechat-8f1a8",
      storageBucket: "privatechat-8f1a8.firebasestorage.app",
      messagingSenderId: "873702558512",
      appId: "1:873702558512:web:ee506e3f954d0d9e69d6f5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, "messages");

    const SECRET_PASSWORD = "AKKISOMEONELOVESYOU";

    window.checkPassword = function() {
      const enteredPass = document.getElementById("pass-input").value.trim().toUpperCase();
      if (enteredPass === SECRET_PASSWORD) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("chat-screen").style.display = "block";
      } else {
        alert("Incorrect password!");
      }
    };

    window.sendMessage = function() {
      const user = document.getElementById("username").value.trim();
      const text = document.getElementById("message").value.trim();

      if (!user) {
        alert("Please enter a secret alias first!");
        return;
      }
      if (!text) {
        alert("Please enter a message!");
        return;
      }

      push(messagesRef, {
        user: user,
        text: text
      });

      document.getElementById("message").value = "";
    };

    onChildAdded(messagesRef, (snapshot) => {
      const data = snapshot.val();
      const currentUser = document.getElementById("username").value.trim();
      const isMe = data.user === currentUser;

      const chatBox = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${isMe ? 'my-msg' : 'friend-msg'}`;
      msgDiv.innerHTML = `<strong>${data.user}:</strong> ${data.text}`;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
