<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat</title>
  
  <!-- Emoji Picker Component -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>

  <style>
    /* DYNAMIC CSS COLOR-CHANGING BACKGROUND (DEFAULT THEME) */
    body { 
      font-family: Arial, sans-serif; 
      max-width: 520px; 
      margin: 20px auto; 
      padding: 15px; 
      min-height: 90vh;
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* BACKGROUND VIDEO STYLES */
    #bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      object-fit: cover;
      transition: opacity 1s ease-in-out;
      display: none;
      transform: translateZ(0);
      will-change: transform;
    }

    h2 { text-align: center; color: #333; }
    
    #login-screen { 
      background: rgba(255, 255, 255, 0.92); 
      padding: 20px; 
      border-radius: 12px; 
      border: 1px solid #ccc; 
      text-align: center; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
      backdrop-filter: blur(8px); 
    }
    
    #chat-screen { 
      display: none; 
      background: rgba(255, 255, 255, 0.92); 
      padding: 20px; 
      border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
      backdrop-filter: blur(8px); 
    }
    
    #chat-box { 
      height: 350px; 
      border: 1px solid #ccc; 
      background: rgba(249, 249, 249, 0.95); 
      overflow-y: scroll; 
      padding: 12px; 
      border-radius: 8px; 
      margin-bottom: 5px; 
    }

    /* MESSAGE STYLES */
    .message { 
      margin-bottom: 12px; 
      padding: 8px 12px; 
      border-radius: 8px; 
      width: fit-content; 
      max-width: 80%; 
      word-wrap: break-word;
      position: relative;
      color: #222;
    }
    
    /* CUSTOM USER COLOR CLASSES */
    .akki-msg { 
      background: #00e5ff; /* Cyan */
      margin-right: auto;
    }
    
    .akkilover-msg { 
      background: #ffea00; /* Yellow */
      margin-left: auto;
    }

    .other-msg {
      background: #e9e9eb;
      margin-right: auto;
    }
    
    .timestamp {
      font-size: 10px;
      opacity: 0.75;
      margin-top: 4px;
      text-align: right;
      display: block;
    }

    /* TYPING INDICATOR */
    #typing-indicator {
      font-size: 12px;
      font-style: italic;
      color: #666;
      height: 18px;
      margin-bottom: 8px;
    }

    /* INPUT CONTROLS */
    .input-container {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group { display: flex; gap: 6px; align-items: center; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 14px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0056b3; }

    /* HEADER CONTROLS */
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }
    .music-btn, .theme-select {
      background: #6c757d;
      color: white;
      font-size: 12px;
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* EMOJI PICKER POPUP */
    emoji-picker {
      position: absolute;
      bottom: 50px;
      right: 0;
      display: none;
      z-index: 100;
      --num-columns: 8;
      --category-emoji-size: 1.125rem;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND VIDEO ELEMENT -->
  <video autoplay muted loop playsinline id="bg-video">
    <source id="video-source" src="" type="video/mp4">
  </video>

  <!-- BACKGROUND MP4 MUSIC ELEMENT -->
  <audio id="bg-music">
    <source id="music-source" src="music1.mp4" type="audio/mp4">
  </audio>

  <!-- STEP 1: PASSWORD LOCK SCREEN -->
  <div id="login-screen">
    <h2>🔒 Protected Chat</h2>
    <p>Enter the secret password to join:</p>
    <div style="display: flex; gap: 8px; justify-content: center;">
      <input type="password" id="pass-input" placeholder="Password...">
      <button onclick="checkPassword()">Enter</button>
    </div>
  </div>

  <!-- STEP 2: CHAT SCREEN -->
  <div id="chat-screen">
    <div class="control-bar">
      <h3 style="margin: 0; font-size: 16px;">Secret Chat</h3>
      <div>
        <!-- THEME SWITCHER DROPDOWN -->
        <select id="theme-select" class="theme-select" onchange="changeThemeCategory(this.value)">
          <option value="default">🎨 Default</option>
          <option value="space">🌌 Space</option>
          <option value="cinematic">🎬 Cinematic</option>
          <option value="love">💖 Love</option>
          <option value="rain">🌧️ Rain</option>
        </select>
        
        <button class="music-btn" id="music-toggle" onclick="toggleMusic()">🔊 Mute</button>
      </div>
    </div>

    <div id="chat-box"></div>
    <div id="typing-indicator"></div>

    <div class="input-container">
      <emoji-picker id="picker"></emoji-picker>
      
      <div class="input-group">
        <input type="text" id="username" placeholder="akki or akkilover" style="width: 35%;" value="">
        <input type="text" id="message" placeholder="Type a message..." oninput="handleTyping()">
        <button type="button" onclick="toggleEmojiPicker()">😊</button>
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- VIDEO & MUSIC PLAYER SCRIPT -->
  <script>
    // VIDEO CATEGORY MAP WITH FILENAMES (1 TO 15)
    const videoThemes = {
      default: [],
      space: [
        "s1.mp4", "s2.mp4", "s3.mp4", "s4.mp4", "s5.mp4",
        "s6.mp4", "s7.mp4", "s8.mp4", "s9.mp4", "s10.mp4",
        "s11.mp4", "s12.mp4", "s13.mp4", "s14.mp4", "s15.mp4"
      ],
      cinematic: [
        "c1.mp4", "c2.mp4", "c3.mp4", "c4.mp4", "c5.mp4",
        "c6.mp4", "c7.mp4", "c8.mp4", "c9.mp4", "c10.mp4",
        "c11.mp4", "c12.mp4", "c13.mp4", "c14.mp4", "c15.mp4"
      ],
      love: [
        "l1.mp4", "l2.mp4", "l3.mp4", "l4.mp4", "l5.mp4",
        "l6.mp4", "l7.mp4", "l8.mp4", "l9.mp4", "l10.mp4",
        "l11.mp4", "l12.mp4", "l13.mp4", "l14.mp4", "l15.mp4"
      ],
      rain: [
        "r1.mp4", "r2.mp4", "r3.mp4", "r4.mp4", "r5.mp4",
        "r6.mp4", "r7.mp4", "r8.mp4", "r9.mp4", "r10.mp4",
        "r11.mp4", "r12.mp4", "r13.mp4", "r14.mp4", "r15.mp4"
      ]
    };

    let currentCategory = "default";
    let currentVideoIndex = 0;
    let videoTimer = null;
    const fiveMinutesInMs = 5 * 60 * 1000;

    function rotateVideo() {
      const videoList = videoThemes[currentCategory];
      if (!videoList || videoList.length === 0) return;

      currentVideoIndex = (currentVideoIndex + 1) % videoList.length;
      const videoPlayer = document.getElementById("bg-video");
      const videoSource = document.getElementById("video-source");

      videoPlayer.style.opacity = "0";

      setTimeout(() => {
        videoSource.src = videoList[currentVideoIndex];
        videoPlayer.load();
        videoPlayer.play();
        videoPlayer.style.opacity = "1";
      }, 1000);
    }

    function changeThemeCategory(category) {
      currentCategory = category;
      clearInterval(videoTimer);

      const videoPlayer = document.getElementById("bg-video");
      const videoSource = document.getElementById("video-source");

      if (category === "default") {
        videoPlayer.style.display = "none";
        videoSource.src = "";
      } else {
        videoPlayer.style.display = "block";
        currentVideoIndex = 0;
        const videoList = videoThemes[category];

        if (videoList && videoList.length > 0) {
          videoSource.src = videoList[0];
          videoPlayer.load();
          videoPlayer.play();
          videoPlayer.style.opacity = "1";

          videoTimer = setInterval(rotateVideo, fiveMinutesInMs);
        }
      }
    }

    // FULL-LENGTH MUSIC PLAYLIST LOGIC
    const musicList = [
      "music1.mp4", "music2.mp4", "music3.mp4", "music4.mp4", "music5.mp4",
      "music6.mp4", "music7.mp4", "music8.mp4", "music9.mp4", "music10.mp4"
    ];

    let currentMusicIndex = 0;

    window.playMusic = function() {
      const musicPlayer = document.getElementById("bg-music");
      musicPlayer.volume = 0.4;
      musicPlayer.play().catch((err) => {
        console.log("Autoplay blocked:", err);
      });
    };

    window.toggleMusic = function() {
      const musicPlayer = document.getElementById("bg-music");
      const musicBtn = document.getElementById("music-toggle");
      if (musicPlayer.paused) {
        musicPlayer.play();
        musicBtn.innerText = "🔊 Mute";
      } else {
        musicPlayer.pause();
        musicBtn.innerText = "📁 Play";
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      const musicPlayer = document.getElementById("bg-music");
      const musicSource = document.getElementById("music-source");

      musicPlayer.addEventListener("ended", () => {
        currentMusicIndex = (currentMusicIndex + 1) % musicList.length;
        musicSource.src = musicList[currentMusicIndex];
        musicPlayer.load();
        musicPlayer.play();
      });

      const picker = document.getElementById('picker');
      picker.addEventListener('emoji-click', event => {
        const msgInput = document.getElementById("message");
        msgInput.value += event.detail.unicode;
      });
    });

    function toggleEmojiPicker() {
      const picker = document.getElementById('picker');
      picker.style.display = picker.style.display === 'block' ? 'none' : 'block';
    }
  </script>

  <!-- FIREBASE CHAT LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAVmzfXqyT_oZaqOyYlM7rvi-PyOyiP_bA",
      authDomain: "privatechat-8f1a8.firebaseapp.com",
      databaseURL: "https://privatechat-8f1a8-default-rtdb.firebaseio.com",
      projectId: "privatechat-8f1a8",
      storageBucket: "privatechat-8f1a8.firebasestorage.app",
      messagingSenderId: "873702558512",
      appId: "1:873702558512:web:ee506e3f954d0d9e69d6f5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, "messages");
    const typingRef = ref(db, "typing");

    const SECRET_PASSWORD = "AKKISOMEONELOVESYOU";
    let typingTimeout = null;

    window.checkPassword = function() {
      const enteredPass = document.getElementById("pass-input").value.trim().toUpperCase();
      if (enteredPass === SECRET_PASSWORD) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("chat-screen").style.display = "block";
        window.playMusic();
      } else {
        alert("Incorrect password!");
      }
    };

    window.handleTyping = function() {
      const user = document.getElementById("username").value.trim().toLowerCase();
      if (!user) return;

      set(typingRef, { user: user, isTyping: true });

      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        set(typingRef, { user: user, isTyping: false });
      }, 2000);
    };

    onValue(typingRef, (snapshot) => {
      const data = snapshot.val();
      const currentUser = document.getElementById("username").value.trim().toLowerCase();
      const typingDiv = document.getElementById("typing-indicator");

      if (data && data.isTyping && data.user !== currentUser) {
        typingDiv.innerText = `${data.user} is typing...`;
      } else {
        typingDiv.innerText = "";
      }
    });

    window.sendMessage = function() {
      const user = document.getElementById("username").value.trim().toLowerCase();
      const text = document.getElementById("message").value.trim();

      // RESTRICT USERNAMES TO ONLY AKKI OR AKKILOVER
      if (user !== "akki" && user !== "akkilover") {
        alert("Only 'akki' or 'akkilover' are allowed as secret aliases!");
        return;
      }
      if (!text) {
        alert("Please enter a message!");
        return;
      }

      const now = new Date();
      const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      push(messagesRef, {
        user: user,
        text: text,
        time: timeString
      });

      document.getElementById("message").value = "";
      document.getElementById('picker').style.display = 'none';
      set(typingRef, { user: user, isTyping: false });
    };

    onChildAdded(messagesRef, (snapshot) => {
      const data = snapshot.val();
      const usernameLower = data.user ? data.user.toLowerCase() : '';

      const chatBox = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      
      // ASSIGN COLORS ACCORDING TO USERNAME
      if (usernameLower === 'akki') {
        msgDiv.className = 'message akki-msg';
      } else if (usernameLower === 'akkilover') {
        msgDiv.className = 'message akkilover-msg';
      } else {
        msgDiv.className = 'message other-msg';
      }
      
      const timeFormatted = data.time ? data.time : '';
      msgDiv.innerHTML = `<strong>${data.user}:</strong> ${data.text}<span class="timestamp">${timeFormatted}</span>`;
      
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
