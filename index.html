<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat</title>
  
  <!-- Emoji Picker Component -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>

  <style>
    /* ENDLESS BACKGROUND VIDEO STYLES */
    #bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      object-fit: cover;
      transition: opacity 1s ease-in-out;
    }

    body { 
      font-family: Arial, sans-serif; 
      max-width: 520px; 
      margin: 20px auto; 
      padding: 15px; 
      min-height: 90vh;
    }
    h2 { text-align: center; color: #333; }
    
    #login-screen { 
      background: rgba(255, 255, 255, 0.92); 
      padding: 20px; 
      border-radius: 12px; 
      border: 1px solid #ccc; 
      text-align: center; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
      backdrop-filter: blur(8px); 
    }
    
    #chat-screen { 
      display: none; 
      background: rgba(255, 255, 255, 0.92); 
      padding: 20px; 
      border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
      backdrop-filter: blur(8px); 
    }
    
    #chat-box { 
      height: 350px; 
      border: 1px solid #ccc; 
      background: rgba(249, 249, 249, 0.95); 
      overflow-y: scroll; 
      padding: 12px; 
      border-radius: 8px; 
      margin-bottom: 5px; 
    }

    /* MESSAGE STYLES */
    .message { 
      margin-bottom: 12px; 
      padding: 8px 12px; 
      border-radius: 8px; 
      width: fit-content; 
      max-width: 80%; 
      word-wrap: break-word;
      position: relative;
    }
    .my-msg { background: #007bff; color: white; margin-left: auto; }
    .friend-msg { background: #e9e9eb; color: #333; }
    
    .timestamp {
      font-size: 10px;
      opacity: 0.75;
      margin-top: 4px;
      text-align: right;
      display: block;
    }

    /* TYPING INDICATOR */
    #typing-indicator {
      font-size: 12px;
      font-style: italic;
      color: #666;
      height: 18px;
      margin-bottom: 8px;
    }

    /* INPUT CONTROLS */
    .input-container {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group { display: flex; gap: 6px; align-items: center; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 14px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0056b3; }

    /* HEADER CONTROLS */
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }
    .music-btn, .theme-select {
      background: #6c757d;
      color: white;
      font-size: 12px;
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* EMOJI PICKER POPUP */
    emoji-picker {
      position: absolute;
      bottom: 50px;
      right: 0;
      display: none;
      z-index: 100;
      --num-columns: 8;
      --category-emoji-size: 1.125rem;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND VIDEO ELEMENT -->
  <video autoplay muted loop playsinline id="bg-video">
    <source id="video-source" src="5.mp4" type="video/mp4">
  </video>

  <!-- BACKGROUND MP4 MUSIC ELEMENT -->
  <audio id="bg-music">
    <source id="music-source" src="music1.mp4" type="audio/mp4">
  </audio>

  <!-- STEP 1: PASSWORD LOCK SCREEN -->
  <div id="login-screen">
    <h2>🔒 Protected Chat</h2>
    <p>Enter the secret password to join:</p>
    <div style="display: flex; gap: 8px; justify-content: center;">
      <input type="password" id="pass-input" placeholder="Password...">
      <button onclick="checkPassword()">Enter</button>
    </div>
  </div>

  <!-- STEP 2: CHAT SCREEN -->
  <div id="chat-screen">
    <div class="control-bar">
      <h3 style="margin: 0; font-size: 16px;">Secret Chat</h3>
      <div>
        <!-- THEME SWITCHER -->
        <select id="theme-select" class="theme-select" onchange="changeThemeCategory(this.value)">
          <option value="all">🎬 Theme: All</option>
          <option value="romantic">💖 Romantic</option>
          <option value="lofi">🌙 Lofi</option>
          <option value="rainy">🌧️ Rainy</option>
        </select>
        
        <button class="music-btn" id="music-toggle" onclick="toggleMusic()">🔊 Mute</button>
      </div>
    </div>

    <div id="chat-box"></div>
    <div id="typing-indicator"></div>

    <div class="input-container">
      <emoji-picker id="picker"></emoji-picker>
      
      <div class="input-group">
        <input type="text" id="username" placeholder="Secret Alias..." style="width: 30%;" value="">
        <input type="text" id="message" placeholder="Type a message..." oninput="handleTyping()">
        <button type="button" onclick="toggleEmojiPicker()">😊</button>
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- VIDEO & MUSIC PLAYER SCRIPT -->
  <script>
    // VIDEO THEME CATEGORIES
    const videoThemes = {
      all: ["5.mp4", "7.mp4", "9.mp4", "10.mp4", "12.mp4", "14.mp4", "15.mp4", "16.mp4", "20.mp4", "21.mp4", "22.mp4", "32.mp4", "11.mp4", "25.mp4", "27.mp4", "29.mp4", "30.mp4", "31.mp4"],
      romantic: ["5.mp4", "7.mp4", "9.mp4", "10.mp4", "12.mp4", "14.mp4"],
      lofi: ["15.mp4", "16.mp4", "20.mp4", "21.mp4", "22.mp4"],
      rainy: ["25.mp4", "27.mp4", "29.mp4", "30.mp4", "31.mp4", "32.mp4"]
    };

    let activeVideoList = videoThemes.all;
    let currentVideoIndex = 0;
    const tenMinutesInMs = 10 * 60 * 1000;

    function changeBackgroundVideo() {
      currentVideoIndex = (currentVideoIndex + 1) % activeVideoList.length;
      
      const videoPlayer = document.getElementById("bg-video");
      const videoSource = document.getElementById("video-source");

      videoPlayer.style.opacity = "0";

      setTimeout(() => {
        videoSource.src = activeVideoList[currentVideoIndex];
        videoPlayer.load();
        videoPlayer.play();
        videoPlayer.style.opacity = "1";
      }, 1000);
    }

    function changeThemeCategory(category) {
      if (videoThemes[category]) {
        activeVideoList = videoThemes[category];
        currentVideoIndex = -1;
        changeBackgroundVideo();
      }
    }

    setInterval(changeBackgroundVideo, tenMinutesInMs);

    // FULL SONG NORMAL PLAYLIST LOGIC
    const musicList = [
      "music1.mp4", "music2.mp4", "music3.mp4", "music4.mp4", "music5.mp4",
      "music6.mp4", "music7.mp4", "music8.mp4", "music9.mp4", "music10.mp4"
    ];

    let currentMusicIndex = 0;

    window.playMusic = function() {
      const musicPlayer = document.getElementById("bg-music");
      musicPlayer.volume = 0.4;
      musicPlayer.play().catch((err) => {
        console.log("Autoplay blocked:", err);
      });
    };

    window.toggleMusic = function() {
      const musicPlayer = document.getElementById("bg-music");
      const musicBtn = document.getElementById("music-toggle");
      if (musicPlayer.paused) {
        musicPlayer.play();
        musicBtn.innerText = "🔊 Mute";
      } else {
        musicPlayer.pause();
        musicBtn.innerText = "📁 Play";
      }
    };

    // Play next full song when current song naturally ends
    document.addEventListener("DOMContentLoaded", () => {
      const musicPlayer = document.getElementById("bg-music");
      const musicSource = document.getElementById("music-source");

      musicPlayer.addEventListener("ended", () => {
        currentMusicIndex = (currentMusicIndex + 1) % musicList.length;
        musicSource.src = musicList[currentMusicIndex];
        musicPlayer.load();
        musicPlayer.play();
      });

      // Emoji picker setup
      const picker = document.getElementById('picker');
      picker.addEventListener('emoji-click', event => {
        const msgInput = document.getElementById("message");
        msgInput.value += event.detail.unicode;
      });
    });

    function toggleEmojiPicker() {
      const picker = document.getElementById('picker');
      picker.style.display = picker.style.display === 'block' ? 'none' : 'block';
    }
  </script>

  <!-- FIREBASE CHAT LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAVmzfXqyT_oZaqOyYlM7rvi-PyOyiP_bA",
      authDomain: "privatechat-8f1a8.firebaseapp.com",
      databaseURL: "https://privatechat-8f1a8-default-rtdb.firebaseio.com",
      projectId: "privatechat-8f1a8",
      storageBucket: "privatechat-8f1a8.firebasestorage.app",
      messagingSenderId: "873702558512",
      appId: "1:873702558512:web:ee506e3f954d0d9e69d6f5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, "messages");
    const typingRef = ref(db, "typing");

    const SECRET_PASSWORD = "AKKISOMEONELOVESYOU";
    let typingTimeout = null;

    window.checkPassword = function() {
      const enteredPass = document.getElementById("pass-input").value.trim().toUpperCase();
      if (enteredPass === SECRET_PASSWORD) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("chat-screen").style.display = "block";
        window.playMusic();
      } else {
        alert("Incorrect password!");
      }
    };

    window.handleTyping = function() {
      const user = document.getElementById("username").value.trim();
      if (!user) return;

      set(typingRef, { user: user, isTyping: true });

      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        set(typingRef, { user: user, isTyping: false });
      }, 2000);
    };

    onValue(typingRef, (snapshot) => {
      const data = snapshot.val();
      const currentUser = document.getElementById("username").value.trim();
      const typingDiv = document.getElementById("typing-indicator");

      if (data && data.isTyping && data.user !== currentUser) {
        typingDiv.innerText = `${data.user} is typing...`;
      } else {
        typingDiv.innerText = "";
      }
    });

    window.sendMessage = function() {
      const user = document.getElementById("username").value.trim();
      const text = document.getElementById("message").value.trim();

      if (!user) {
        alert("Please enter a secret alias first!");
        return;
      }
      if (!text) {
        alert("Please enter a message!");
        return;
      }

      const now = new Date();
      const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      push(messagesRef, {
        user: user,
        text: text,
        time: timeString
      });

      document.getElementById("message").value = "";
      document.getElementById('picker').style.display = 'none';
      set(typingRef, { user: user, isTyping: false });
    };

    onChildAdded(messagesRef, (snapshot) => {
      const data = snapshot.val();
      const currentUser = document.getElementById("username").value.trim();
      const isMe = data.user === currentUser;

      const chatBox = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${isMe ? 'my-msg' : 'friend-msg'}`;
      
      const timeFormatted = data.time ? data.time : '';
      msgDiv.innerHTML = `<strong>${data.user}:</strong> ${data.text}<span class="timestamp">${timeFormatted}</span>`;
      
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
