<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambient Video & Custom Alert Hub</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h2 {
      margin-top: 0;
      text-align: center;
    }
    .controls-panel {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }
    @media (min-width: 650px) {
      .controls-panel {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    .control-group {
      display: flex;
      flex-direction: column;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 13px;
      color: #ccc;
    }
    select, input[type="file"], button {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .alert-actions {
      display: flex;
      gap: 6px;
    }
    .alert-actions select {
      flex: 1;
    }
    button {
      cursor: pointer;
      background: #007bff;
      border: none;
      font-weight: bold;
    }
    button:hover {
      background: #0056b3;
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .status-bar {
      margin-top: 10px;
      font-size: 12px;
      color: #888;
      text-align: right;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Ambient Hub & Custom Alert System</h2>

  <div class="controls-panel">
    <!-- Category Selection (15 videos per section) -->
    <div class="control-group">
      <label for="categorySelect">Theme (15 Videos, 5-min switch):</label>
      <select id="categorySelect" onchange="changeCategory()">
        <option value="space">Space</option>
        <option value="cinematic">Cinematic</option>
        <option value="love">Love</option>
        <option value="rain">Rain</option>
      </select>
    </div>

    <!-- 10 Background Music Track Options -->
    <div class="control-group">
      <label for="musicSelect">Background Music (10 Options):</label>
      <select id="musicSelect" onchange="changeMusic()">
        <option value="">-- Mute Music --</option>
        <option value="music1.mp3">1. Soft Piano</option>
        <option value="music2.mp3">2. Gentle Rain Ambience</option>
        <option value="music3.mp3">3. Cinematic Strings</option>
        <option value="music4.mp3">4. Space Soundscape</option>
        <option value="music5.mp3">5. Romantic Guitar</option>
        <option value="music6.mp3">6. Deep Chill Lofi</option>
        <option value="music7.mp3">7. Acoustic Medley</option>
        <option value="music8.mp3">8. Celestial Waves</option>
        <option value="music9.mp3">9. Emotional Violin</option>
        <option value="music10.mp3">10. Peaceful Meditation</option>
      </select>
    </div>

    <!-- Custom Alert Tone Controls -->
    <div class="control-group">
      <label for="toneSelect">Alert Tone Engine:</label>
      <div class="alert-actions">
        <select id="toneSelect" onchange="updateAlertTone()">
          <option value="https://actions.google.com/sounds/v1/notifications/beep_short.ogg">Default Beep</option>
          <option value="https://actions.google.com/sounds/v1/notifications/ambient_bell.ogg">Ambient Bell</option>
          <option value="https://actions.google.com/sounds/v1/notifications/chime.ogg">Chime</option>
          <option value="alert1.mp3">Local Alert 1</option>
          <option value="alert2.mp3">Local Alert 2</option>
          <option value="custom">Upload File...</option>
        </select>
        <button onclick="playAlertTone()">Test</button>
      </div>

      <!-- Hidden File Input for Custom Tone Upload -->
      <input type="file" id="customToneInput" accept="audio/*" style="display: none;" onchange="handleCustomTone(event)">
    </div>
  </div>

  <!-- Main Video Player -->
  <div class="video-container">
    <video id="mainPlayer" autoplay muted loop playsinline></video>
  </div>
  <div class="status-bar" id="statusBar">Initializing player...</div>
</div>

<!-- Audio Player for Background Music -->
<audio id="bgMusicPlayer" loop></audio>

<script>
  // GitHub Page / External Host Configuration (Optional: change if using raw links)
  const USE_GITHUB_HOSTING = false;
  const GITHUB_USERNAME = "your-username";
  const GITHUB_REPO = "your-repo";
  const GITHUB_BRANCH = "main";

  function getPath(file) {
    if (file.startsWith("http://") || file.startsWith("https://")) {
      return file;
    }
    if (USE_GITHUB_HOSTING) {
      return `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/${GITHUB_BRANCH}/${file}`;
    }
    return `./${file}`;
  }

  // Database of 15 videos per category
  const videoData = {
    space: Array.from({length: 15}, (_, i) => `space${i + 1}.mp4`),
    cinematic: Array.from({length: 15}, (_, i) => `cinematic${i + 1}.mp4`),
    love: Array.from({length: 15}, (_, i) => `love${i + 1}.mp4`),
    rain: Array.from({length: 15}, (_, i) => `rain${i + 1}.mp4`)
  };

  let currentCategory = "space";
  let currentVideoIndex = 0;
  let rotationTimer = null;

  const player = document.getElementById("mainPlayer");
  const bgMusicPlayer = document.getElementById("bgMusicPlayer");
  const statusBar = document.getElementById("statusBar");
  let alertAudio = new Audio(getPath("https://actions.google.com/sounds/v1/notifications/beep_short.ogg"));

  // Safe Video Loader with Fallback Error Handling
  player.onerror = function() {
    console.warn("Could not load video source:", player.src);
    statusBar.textContent = `File non-existent or path error: ${videoData[currentCategory][currentVideoIndex]}`;
  };

  function loadVideo() {
    const videoList = videoData[currentCategory];
    const targetFile = videoList[currentVideoIndex];
    player.src = getPath(targetFile);
    statusBar.textContent = `Theme: ${currentCategory.toUpperCase()} | Playing: ${targetFile} (${currentVideoIndex + 1}/15)`;
    
    player.play().catch(e => console.log("Autoplay check:", e));
  }

  // 5-minute auto rotation logic (300,000 ms)
  function startVideoRotation() {
    if (rotationTimer) clearInterval(rotationTimer);
    
    rotationTimer = setInterval(() => {
      currentVideoIndex = (currentVideoIndex + 1) % videoData[currentCategory].length;
      loadVideo();
    }, 5 * 60 * 1000); 
  }

  function changeCategory() {
    currentCategory = document.getElementById("categorySelect").value;
    currentVideoIndex = 0;
    loadVideo();
    startVideoRotation();
  }

  // Music Player logic
  function changeMusic() {
    const musicSrc = document.getElementById("musicSelect").value;
    if (musicSrc) {
      bgMusicPlayer.src = getPath(musicSrc);
      bgMusicPlayer.play().catch(e => console.log("Music play blocked/file missing:", e));
    } else {
      bgMusicPlayer.pause();
    }
  }

  // Custom Alert Tone logic
  function updateAlertTone() {
    const select = document.getElementById("toneSelect");
    if (select.value === "custom") {
      document.getElementById("customToneInput").click();
    } else {
      alertAudio.src = getPath(select.value);
    }
  }

  function handleCustomTone(event) {
    const file = event.target.files[0];
    if (file) {
      const customUrl = URL.createObjectURL(file);
      alertAudio.src = customUrl;
      alertAudio.play().catch(e => console.log("Audio play blocked:", e));
    }
  }

  function playAlertTone() {
    alertAudio.currentTime = 0;
    alertAudio.play().catch(err => {
      console.log("Audio play blocked:", err);
      alert("Selected audio file not found or browser blocked playback!");
    });
  }

  // Initialize
  loadVideo();
  startVideoRotation();
</script>

</body>
</html>
